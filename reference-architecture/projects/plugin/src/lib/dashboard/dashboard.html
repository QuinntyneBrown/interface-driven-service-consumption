<mat-card data-testid="dashboard" appearance="outlined">
  <mat-card-header>
    <mat-card-title class="header-row">
      <span>Dashboard</span>
      <span class="spacer"></span>
      <button
        mat-flat-button
        color="primary"
        data-testid="load-btn"
        type="button"
        (click)="store.loadWidgets()"
      >
        <mat-icon>cloud_download</mat-icon>
        Load
      </button>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (store.loading()) {
      <mat-progress-bar
        mode="indeterminate"
        data-testid="loading"
      ></mat-progress-bar>
    }

    <mat-list>
      @for (w of store.widgets(); track w.id) {
        <mat-list-item
          [attr.data-testid]="'widget-' + w.id"
          [class.selected]="w.id === store.selectedWidgetId()"
          [class.selected-row]="w.id === store.selectedWidgetId()"
        >
          <span matListItemTitle>{{ w.title }}</span>
          <span matListItemLine>Value: {{ w.value }}</span>
          <span matListItemMeta class="row-meta">
            <button
              mat-stroked-button
              [attr.data-testid]="'select-' + w.id"
              type="button"
              (click)="store.selectWidget(w.id)"
            >Select</button>
            <button
              mat-icon-button
              [attr.data-testid]="'refresh-' + w.id"
              type="button"
              aria-label="Refresh widget"
              (click)="store.refreshWidget(w.id)"
            >
              <mat-icon>refresh</mat-icon>
            </button>
          </span>
        </mat-list-item>
      } @empty {
        <mat-list-item data-testid="empty">
          <span matListItemTitle class="empty">No widgets loaded yet.</span>
        </mat-list-item>
      }
    </mat-list>
  </mat-card-content>

  <mat-divider></mat-divider>

  <mat-card-content>
    <h3 class="section-heading">Selected</h3>
    @if (selectedWidget(); as w) {
      <p data-testid="details" class="details">
        {{ w.title }} — {{ w.value }}
      </p>
    } @else {
      <p data-testid="details-empty" class="details-empty">
        No widget selected.
      </p>
    }
  </mat-card-content>
</mat-card>
